; AI Glasses ESP32-S3 firmware
;
; Default target: Seeed XIAO ESP32S3 Sense (has on-board OV2640 camera + I2S mic).
; If you use a different S3 board (ESP32-S3-CAM / Freenove / custom), copy this env
; block, change the `board` field, and update `src/pins.h` accordingly.

[platformio]
default_envs = xiao_esp32s3_sense

[env]
framework = arduino
platform = espressif32@^6.7.0
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4
    esp32-camera

[env:xiao_esp32s3_sense]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DAIGLS_BOARD_XIAO_S3_SENSE=1

[env:esp32s3_cam]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DAIGLS_BOARD_ESP32S3_CAM=1
