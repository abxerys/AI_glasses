; AI Glasses ESP32-S3 firmware
;
; Targets:
;   xiao_esp32s3_ov3660  — Seeed XIAO ESP32-S3 (base) + external OV3660
;                          camera + MAX98357A I2S amp. This is the build
;                          for the project's reference hardware.
;   xiao_esp32s3_sense   — Seeed XIAO ESP32-S3 Sense (on-board OV2640 + PDM mic)
;   esp32s3_cam          — generic ESP32-S3-CAM dev board
;
; XIAO ESP32-S3 and XIAO ESP32-S3 Sense share the same module footprint and
; the same camera FPC connector, so the camera pin map is identical.

[platformio]
default_envs = xiao_esp32s3_ov3660

[env]
framework = arduino
platform = espressif32@^6.7.0
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4
    esp32-camera

[env:xiao_esp32s3_ov3660]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DAIGLS_BOARD_XIAO_S3=1
    -DAIGLS_CAMERA_OV3660=1
    -DAIGLS_HAS_PDM_MIC=1
    -DAIGLS_HAS_I2S_SPEAKER=1

[env:xiao_esp32s3_sense]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DAIGLS_BOARD_XIAO_S3=1
    -DAIGLS_CAMERA_OV2640=1
    -DAIGLS_HAS_PDM_MIC=1

[env:esp32s3_cam]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DAIGLS_BOARD_ESP32S3_CAM=1
    -DAIGLS_CAMERA_OV2640=1
